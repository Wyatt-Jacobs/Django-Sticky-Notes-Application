{% extends 'base.html' %}

{% block content %}

<div class="notes-container">

    <a href="{% url 'note_create' %}" class="add-note-card">
        <span class="plus">+</span>
        <p>Add Note</p>
    </a>

    {% for note in notes %}
    <div class="note-card">
        <h3>{{ note.title }}</h3>
        <p>{{ note.content|truncatewords:20 }}</p>

        <a href="{% url 'note_detail' pk=note.pk %}">
            Open Note
        </a>
    </div>
    {% endfor %}

</div>

{% endblock %}
